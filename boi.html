      { q: "Soot buildup on heating surface:", options: ["acts as an insulation", "prevents heat transfer", "increases temperature of gases of combustion", "all of the above"], answer: 3 },
      { q: "The purpose of automatic combustion controls is to control ____ and ____.", options: ["high fire; low fire", "stoker firing; fuel rate", "overfire air; fuel mixture", "proper air to fuel mixture; firing rate"], answer: 3 },
      { q: "At 0 psig, how many BTU are necessary to change 1 lb of water at 212°F into steam?", options: ["144", "970", "180", "1190"], answer: 1 },
      { q: "Radiation is:", options: ["the movement of liquids or gases created by a temperature difference", "the transfer of heat by direct molecular contact", "the weight of the substance compared to unity", "a form of heat transfer"], answer: 3 },
      { q: "Steam at 100 psi and 400°F is:", options: ["saturated", "superheated", "wet", "none of the above"], answer: 1 },
      { q: "Which of the following most closely defines sensible heat?", options: ["an established relationship comparing any substance to the heat content of water", "heat quantity that can be felt or measured by a thermometer", "heat quantity above the point of saturation", "measure of heat intensity"], answer: 1 },
      { q: "What heat is required to raise the temperature of 1 lb of water from 32°F to 212°F?", options: ["144 Btu", "970.3 Btu", "180 Btu", "Saturated heat"], answer: 2 },
      { q: "Increasing the pressure has what effect on the boiling point of water?", options: ["No change", "Temperature will be raised", "Temperature will be lowered", "Temperature will increase 2°F for every psi"], answer: 1 },
      { q: "Heat absorbed by water when it changes from liquid to steam at the boiling point is called:", options: ["sensible heat", "specific heat", "latent heat", "superheat"], answer: 2 },
      { q: "Heat may be transferred in how many ways?", options: ["One", "Three", "Two", "Four"], answer: 1 }
    ];

    let currentQuestions = [];
    let score = 0;
    let answeredCount = 0;

    function shuffleArray(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function initQuiz() {
      score = 0;
      answeredCount = 0;
      document.getElementById("score-summary").style.display = "none";
      
      currentQuestions = originalQuestions.map(q => {
        let opts = q.options.map((opt, idx) => ({ text: opt, isCorrect: idx === q.answer }));
        shuffleArray(opts);
        return {
          q: q.q,
          options: opts
        };
      });
      shuffleArray(currentQuestions);

      document.getElementById("total-count").innerText = currentQuestions.length;
      document.getElementById("answered-count").innerText = 0;
      document.getElementById("score-count").innerText = 0;

      const container = document.getElementById("quiz-body");
      container.innerHTML = "";

      currentQuestions.forEach((qObj, qIdx) => {
        const card = document.createElement("div");
        card.className = "q-card";
        
        const title = document.createElement("div");
        title.className = "q-title";
        title.innerText = `${qIdx + 1}. ${qObj.q}`;
        card.appendChild(title);

        qObj.options.forEach((optObj, oIdx) => {
          const btn = document.createElement("button");
          btn.className = "opt-btn";
          btn.innerText = `${String.fromCharCode(65 + oIdx)}. ${optObj.text}`;
          btn.onclick = () => checkAnswer(qIdx, optObj, card);
          card.appendChild(btn);
        });

        container.appendChild(card);
      });
    }

    function checkAnswer(qIdx, selectedOpt, cardElement) {
      const btns = cardElement.querySelectorAll(".opt-btn");
      btns.forEach(btn => btn.disabled = true);

      if (selectedOpt.isCorrect) {
        score++;
        event.target.classList.add("correct");
      } else {
        event.target.classList.add("incorrect");
        currentQuestions[qIdx].options.forEach((opt, idx) => {
          if (opt.isCorrect) {
            btns[idx].classList.add("correct");
          }
        });
      }

      answeredCount++;
      document.getElementById("score-count").innerText = score;
      document.getElementById("answered-count").innerText = answeredCount;

      if (answeredCount === currentQuestions.length) {
        const summary = document.getElementById("score-summary");
        document.getElementById("final-score-text").innerText = `You scored ${score} out of ${currentQuestions.length} (${((score/currentQuestions.length)*100).toFixed(1)}%)`;
        summary.style.display = "block";
      }
    }

    window.onload = initQuiz;
  </script>
</body>
</html>
