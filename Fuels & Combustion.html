let currentQuestions = [...quizData];
let currentIndex = 0;
let userAnswers = {};
let isShuffle = false;

function initQuiz() {
    renderQuestion();
    updateProgress();
}

function renderQuestion() {
    const q = currentQuestions[currentIndex];
    document.getElementById('q-number').innerText = `Question ${currentIndex + 1} of ${currentQuestions.length} (ID: #${q.id})`;
    document.getElementById('q-text').innerText = q.question;

    const optionsContainer = document.getElementById('options-container');
    optionsContainer.innerHTML = '';

    const letters = ['A', 'B', 'C', 'D'];
    const userChoice = userAnswers[q.id];

    q.options.forEach((opt, idx) => {
        const letter = letters[idx];
        const li = document.createElement('li');
        li.className = 'option-item';

        if (userChoice) {
            li.classList.add('disabled');
            if (letter === q.answer) {
                li.classList.add('show-correct');
            }
            if (letter === userChoice && userChoice !== q.answer) {
                li.classList.add('selected-incorrect');
            }
            if (letter === userChoice && userChoice === q.answer) {
                li.classList.add('selected-correct');
            }
        } else {
            li.onclick = () => selectOption(letter);
        }

        li.innerHTML = `<span class="option-prefix">${letter}.</span><span>${opt}</span>`;
        optionsContainer.appendChild(li);
    });

    document.getElementById('prev-btn').disabled = currentIndex === 0;
    document.getElementById('next-btn').innerText = currentIndex === currentQuestions.length - 1 ? 'Finish' : 'Next';
}

function selectOption(selectedLetter) {
    const q = currentQuestions[currentIndex];
    if (userAnswers[q.id]) return; // Already answered

    userAnswers[q.id] = selectedLetter;
    updateScore();
    renderQuestion();
}

function updateScore() {
    let score = 0;
    let answeredCount = Object.keys(userAnswers).length;

    for (let qId in userAnswers) {
        const question = quizData.find(q => q.id == qId);
        if (question && userAnswers[qId] === question.answer) {
            score++;
        }
    }

    document.getElementById('score').innerText = score;
    document.getElementById('answered-count').innerText = answeredCount;
}

function updateProgress() {
    const progress = ((currentIndex + 1) / currentQuestions.length) * 100;
    document.getElementById('progress-bar').style.width = `${progress}%`;
}

function nextQuestion() {
    if (currentIndex < currentQuestions.length - 1) {
        currentIndex++;
        renderQuestion();
        updateProgress();
    } else {
        showResults();
    }
}

function prevQuestion() {
    if (currentIndex > 0) {
        currentIndex--;
        renderQuestion();
        updateProgress();
    }
}

function toggleShuffle() {
    isShuffle = document.getElementById('shuffle-toggle').checked;
    resetQuiz();
}

function resetQuiz() {
    userAnswers = {};
    currentIndex = 0;
    if (isShuffle) {
        currentQuestions = [...quizData].sort(() => Math.random() - 0.5);
    } else {
        currentQuestions = [...quizData];
    }
    document.getElementById('quiz-body').style.display = 'block';
    document.getElementById('results-body').style.display = 'none';
    updateScore();
    renderQuestion();
    updateProgress();
}

function showResults() {
    document.getElementById('quiz-body').style.display = 'none';
    document.getElementById('results-body').style.display = 'block';

    let score = 0;
    for (let qId in userAnswers) {
        const question = quizData.find(q => q.id == qId);
        if (question && userAnswers[qId] === question.answer) {
            score++;
        }
    }

    const percentage = Math.round((score / quizData.length) * 100);
    document.getElementById('final-score').innerText = `${score} / ${quizData.length}`;
    document.getElementById('percentage-score').innerText = `Percentage: ${percentage}%`;
}

window.onload = initQuiz;
</script>
