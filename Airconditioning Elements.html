    let currentQuestions = [];
    let userAnswers = {};
    let score = 0;

    function init() {
      currentQuestions = JSON.parse(JSON.stringify(originalQuestions));
      userAnswers = {};
      score = 0;
      document.getElementById('total').textContent = currentQuestions.length;
      document.getElementById('score').textContent = 0;
      renderQuiz();
    }

    function renderQuiz() {
      const container = document.getElementById('quiz-container');
      container.innerHTML = '';

      currentQuestions.forEach((q, qIndex) => {
        const card = document.createElement('div');
        card.className = 'question-card';
        
        const qText = document.createElement('div');
        qText.className = 'question-text';
        qText.textContent = `${qIndex + 1}. ${q.q}`;
        card.appendChild(qText);

        const optionsList = document.createElement('ul');
        optionsList.className = 'options';

        q.options.forEach((opt, optIndex) => {
          const li = document.createElement('li');
          li.className = 'option-item';
          
          const btn = document.createElement('button');
          btn.className = 'option-btn';
          const labels = ['A', 'B', 'C', 'D'];
          btn.textContent = `${labels[optIndex]}. ${opt}`;
          
          btn.onclick = () => selectAnswer(qIndex, optIndex, btn);
          
          if (userAnswers[qIndex] !== undefined) {
            btn.disabled = true;
            if (optIndex === q.answer) {
              btn.classList.add('correct');
            }
            if (userAnswers[qIndex] === optIndex && optIndex !== q.answer) {
              btn.classList.add('incorrect');
            }
          }

          li.appendChild(btn);
          optionsList.appendChild(li);
        });

        card.appendChild(optionsList);
        container.appendChild(card);
      });
    }

    function selectAnswer(qIndex, optIndex, btnEl) {
      if (userAnswers[qIndex] !== undefined) return;

      userAnswers[qIndex] = optIndex;
      const q = currentQuestions[qIndex];

      if (optIndex === q.answer) {
        score++;
        document.getElementById('score').textContent = score;
      }

      renderQuiz();
    }

    function shuffleAndReset() {
      // Shuffle questions
      for (let i = originalQuestions.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [originalQuestions[i], originalQuestions[j]] = [originalQuestions[j], originalQuestions[i]];
      }
      
      // Shuffle options for each question
      originalQuestions.forEach(q => {
        const correctOptText = q.options[q.answer];
        for (let i = q.options.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [q.options[i], q.options[j]] = [q.options[j], q.options[i]];
        }
        q.answer = q.options.indexOf(correctOptText);
      });

      init();
    }

    function resetQuiz() {
      userAnswers = {};
      score = 0;
      document.getElementById('score').textContent = 0;
      renderQuiz();
    }

    window.onload = init;
  </script>
