let activeQuestions = [...quizData];
let currentIndex = 0;

function loadQuestion() {
  const q = activeQuestions[currentIndex];
  document.getElementById("q-number").innerText = `Question ${currentIndex + 1} / ${activeQuestions.length} (Original ID: #${q.id})`;
  document.getElementById("q-text").innerText = q.q;
  document.getElementById("feedback").innerText = "";
  
  const container = document.getElementById("options-container");
  container.innerHTML = "";
  
  q.options.forEach((opt, idx) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerText = `${String.fromCharCode(65 + idx)}. ${opt}`;
    btn.onclick = () => checkAnswer(idx, q.ans, btn);
    container.appendChild(btn);
  });
}

function checkAnswer(selected, correct, btn) {
  const buttons = document.querySelectorAll(".option-btn");
  buttons.forEach(b => b.disabled = true);
  
  if (selected === correct) {
    btn.classList.add("correct");
    document.getElementById("feedback").innerText = "✨ Correct!";
    document.getElementById("feedback").style.color = "#28a745";
  } else {
    btn.classList.add("incorrect");
    buttons[correct].classList.add("correct");
    document.getElementById("feedback").innerText = `❌ Incorrect. Correct answer: ${String.fromCharCode(65 + correct)}`;
    document.getElementById("feedback").style.color = "#dc3545";
  }
}

function nextQuestion() {
  if (currentIndex < activeQuestions.length - 1) {
    currentIndex++;
    loadQuestion();
  }
}

function prevQuestion() {
  if (currentIndex > 0) {
    currentIndex--;
    loadQuestion();
  }
}

function shuffleQuiz() {
  for (let i = activeQuestions.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [activeQuestions[i], activeQuestions[j]] = [activeQuestions[j], activeQuestions[i]];
  }
  currentIndex = 0;
  loadQuestion();
}

loadQuestion();
</script>
